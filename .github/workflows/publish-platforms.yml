name: Publish Platforms

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

defaults:
  run:
    shell: pwsh

jobs:
  desktop:
    name: Desktop (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-26
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: |
          $publishDirectory = if ($env:RUNNER_OS -eq 'macOS') { 'artifacts/publish' } else { 'artifacts/package' }
          dotnet publish src/Hosts/Desktop/MusicPlayer2-Avalonia.Desktop.csproj `
            --configuration $env:CONFIGURATION `
            --runtime ${{ matrix.rid }} `
            --self-contained true `
            -p:UseAppHost=true `
            --output $publishDirectory

      - name: Create macOS app bundle
        if: startsWith(matrix.rid, 'osx-')
        run: |
          $appName = 'MusicPlayer2-Avalonia.Desktop'
          $contentsDirectory = "artifacts/package/$appName.app/Contents"
          $macOsDirectory = Join-Path $contentsDirectory 'MacOS'
          New-Item -ItemType Directory -Force -Path $macOsDirectory | Out-Null
          Copy-Item -Path 'artifacts/publish/*' -Destination $macOsDirectory -Recurse -Force
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>$appName</string>
            <key>CFBundleIdentifier</key>
            <string>io.github.victorlcosta.musicplayer2.desktop</string>
            <key>CFBundleName</key>
            <string>MusicPlayer2</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          "@ | Set-Content -Path (Join-Path $contentsDirectory 'Info.plist') -NoNewline

      - name: Package desktop artifact
        run: |
          Copy-Item docs/desktop-installation.md artifacts/package/INSTALL.md
          New-Item -ItemType Directory -Force -Path artifacts/upload | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            Compress-Archive -Path 'artifacts/package/*' -DestinationPath 'artifacts/upload/MusicPlayer2-${{ matrix.rid }}.zip'
          } else {
            # tar preserves executable bits and symlinks inside the downloaded artifact.
            tar -czf 'artifacts/upload/MusicPlayer2-${{ matrix.rid }}.tar.gz' -C artifacts/package .
            if ($LASTEXITCODE -ne 0) { throw 'Desktop archive creation failed.' }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MusicPlayer2-Avalonia-Desktop-${{ matrix.rid }}
          path: artifacts/upload
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore WebAssembly workload
        run: dotnet workload restore src/Hosts/Browser/MusicPlayer2-Avalonia.Browser.csproj
      - name: Publish
        run: dotnet publish src/Hosts/Browser/MusicPlayer2-Avalonia.Browser.csproj --configuration $env:CONFIGURATION -p:PublishTrimmed=false --output artifacts/browser-publish
      - name: Stage static site
        run: |
          $wwwroot = 'artifacts/browser-publish/wwwroot'
          if (-not (Test-Path "$wwwroot/index.html") -or -not (Test-Path "$wwwroot/_framework")) {
            throw "WebAssembly output was not found at $wwwroot."
          }
          New-Item -ItemType Directory -Force -Path artifacts/browser | Out-Null
          Copy-Item -Path "$wwwroot/*" -Destination artifacts/browser -Recurse -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MusicPlayer2-Avalonia-Browser
          path: artifacts/browser
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android (test APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore Android workload
        run: dotnet workload restore src/Hosts/Android/MusicPlayer2-Avalonia.Android.csproj
      - name: Publish test APK
        # The SDK signs with its development key; no release signing secrets are needed.
        run: |
          dotnet publish src/Hosts/Android/MusicPlayer2-Avalonia.Android.csproj `
            --framework net10.0-android `
            --configuration $env:CONFIGURATION `
            -p:AndroidKeyStore=false `
            -p:AndroidPackageFormats=apk
      - name: Stage installable APK
        run: |
          $publishDirectory = 'src/Hosts/Android/bin/Release/net10.0-android/publish'
          $packages = @(Get-ChildItem -Path $publishDirectory -Filter '*-Signed.apk' -File)
          if ($packages.Count -ne 1) {
            throw "Expected one signed test APK, found $($packages.Count)."
          }
          New-Item -ItemType Directory -Force -Path artifacts/android | Out-Null
          Copy-Item $packages[0].FullName artifacts/android/MusicPlayer2-Android-test.apk
          Copy-Item docs/mobile-testing.md artifacts/android/INSTALL.md
      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: MusicPlayer2-Android-test-apk
          path: artifacts/android
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS Simulator (Apple Silicon Mac)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore iOS workload
        run: dotnet workload restore src/Hosts/iOS/MusicPlayer2-Avalonia.iOS.csproj
      - name: Build simulator app
        run: |
          dotnet build src/Hosts/iOS/MusicPlayer2-Avalonia.iOS.csproj `
            --configuration $env:CONFIGURATION `
            -p:RuntimeIdentifier=iossimulator-arm64 `
            -p:EnableCodeSigning=false
      - name: Package simulator app
        run: |
          $appDirectory = 'src/Hosts/iOS/bin/Release/net10.0-ios/iossimulator-arm64/MusicPlayer2-Avalonia.iOS.app'
          if (-not (Test-Path "$appDirectory/Info.plist")) {
            throw "Simulator app was not found at $appDirectory."
          }
          New-Item -ItemType Directory -Force -Path artifacts/ios-simulator/package,artifacts/ios-simulator/upload | Out-Null
          Copy-Item $appDirectory artifacts/ios-simulator/package -Recurse
          Copy-Item docs/mobile-testing.md artifacts/ios-simulator/package/INSTALL.md
          tar -czf artifacts/ios-simulator/upload/MusicPlayer2-iOS-Simulator-arm64.tar.gz -C artifacts/ios-simulator/package .
          if ($LASTEXITCODE -ne 0) { throw 'Simulator archive creation failed.' }
      - name: Upload simulator app (not for physical iPhones)
        uses: actions/upload-artifact@v7
        with:
          name: MusicPlayer2-iOS-Simulator-arm64
          path: artifacts/ios-simulator/upload
          if-no-files-found: error
          retention-days: 14
